services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_analyzer_postgres
    environment:
      POSTGRES_DB: rag_analyzer
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "6384:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rag_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag_analyzer_redis
    ports:
      - "6383:6379"  # Changed host port to avoid conflict
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
